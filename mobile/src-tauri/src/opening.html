<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Asked again every second: the real interface answers this same address
     as soon as the databases are open. -->
<meta http-equiv="refresh" content="1">
<title>tsuburu</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-content: center;
    gap: 0.5rem;
    padding: 1.5rem;
    box-sizing: border-box;
    text-align: center;
    font: 15px/1.5 system-ui, sans-serif;
    background: Canvas;
    color: CanvasText;
  }
  p { margin: 0; }
  .why { opacity: 0.7; font-size: 13px; }
</style>
</head>
<body>
<p id="what" role="status">Opening tsuburu…</p>
<p id="why" class="why">The first launch after an update can take a while.</p>
<script>
  // The interface's own translations are not loaded yet - they are what is
  // being waited for - so the three it speaks are spelled out here.
  const said = {
    ko: ['tsuburu를 여는 중입니다…', '업데이트 직후 처음 열 때는 시간이 걸릴 수 있습니다.'],
    ja: ['tsuburu を開いています…', 'アップデート直後の初回は時間がかかることがあります。'],
  }[navigator.language.slice(0, 2)]
  if (said) {
    document.documentElement.lang = navigator.language
    document.getElementById('what').textContent = said[0]
    document.getElementById('why').textContent = said[1]
  }
</script>
</body>
</html>
