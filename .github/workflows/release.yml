name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the frontend
        working-directory: web
        run: npm ci && npm run build

      - run: cargo build --release --locked -p tsuburu --target ${{ matrix.target }}

      # One file per platform: the frontend is inside the binary already.
      - name: Package
        shell: bash
        run: |
          name="tsuburu-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/tsuburu.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/tsuburu" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/" 2>/dev/null || cp README.md "dist/$name/"
          cd dist && tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: tsuburu-${{ matrix.target }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          body: |
            Download the archive for your platform, unpack it, and run `tsuburu`.

            macOS builds are unsigned: right-click the binary and choose Open
            the first time.
          generate_release_notes: true
