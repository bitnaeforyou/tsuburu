name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the frontend
        working-directory: web
        run: npm ci && npm run build

      # The binary is told where it was published, so it can offer the next
      # one. It is not written in the source: this repository is not
      # necessarily the one a reader downloaded from.
      - run: cargo build --release --locked -p tsuburu --target ${{ matrix.target }}
        env:
          TSUBURU_RELEASES: ${{ github.repository }}

      # Packed so that someone who has never opened a terminal can start it:
      # zip on macOS and Windows, which both unpack on a double-click, and a
      # launcher beside the binary that does the one awkward step for them.
      - name: Package
        shell: bash
        run: |
          name="tsuburu-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md README.ko.md LICENSE "dist/$name/"

          case "${{ matrix.os }}" in
            windows-latest)
              cp "target/${{ matrix.target }}/release/tsuburu.exe" "dist/$name/"
              cp packaging/START-HERE-windows.txt "dist/$name/START-HERE.txt"
              (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
              ;;
            macos-latest)
              cp "target/${{ matrix.target }}/release/tsuburu" "dist/$name/"
              cp "packaging/start-macos.command" "dist/$name/Start tsuburu.command"
              cp packaging/START-HERE-macos.txt "dist/$name/START-HERE.txt"
              chmod +x "dist/$name/tsuburu" "dist/$name/Start tsuburu.command"
              # -X keeps the archive free of the extra files macOS would add.
              (cd dist && zip -qrX "$name.zip" "$name")
              ;;
            *)
              cp "target/${{ matrix.target }}/release/tsuburu" "dist/$name/"
              cp packaging/start-linux.sh "dist/$name/start.sh"
              cp packaging/START-HERE-linux.txt "dist/$name/START-HERE.txt"
              chmod +x "dist/$name/tsuburu" "dist/$name/start.sh"
              (cd dist && tar -czf "$name.tar.gz" "$name")
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: tsuburu-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  image:
    name: container image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-cased because a registry will not take a capital letter in a
      # name, and an account may well have one.
      - name: Work out where this goes
        id: where
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        env:
          # Nothing reads these, and they land in the run's artifacts where
          # the release job has to be told to ignore them.
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          build-args: |
            TSUBURU_RELEASES=${{ github.repository }}
          tags: |
            ${{ steps.where.outputs.image }}:${{ steps.where.outputs.version }}
            ${{ steps.where.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ios:
    name: iOS package
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: brew install xcodegen
      - name: Build the frontend
        working-directory: web
        run: npm ci && npm run build

      # Nobody signs this. Whoever wants it signs it with their own Apple ID,
      # because ours would not work for them and the only way to hand over a
      # signed app is the paid programme.
      - name: Build the package
        working-directory: mobile
        run: ./build-ios-unsigned.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tsuburu-ios
          path: mobile/dist/*.ipa

  # Android refuses to install an APK with no signature at all, so unlike the
  # iPhone build this one cannot be handed over unsigned. Where the key is not
  # configured the job produces nothing rather than something nobody can
  # install.
  key:
    name: Signing key
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.look.outputs.configured }}
    steps:
      - id: look
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: echo "configured=${{ env.KEYSTORE != '' }}" >> "$GITHUB_OUTPUT"

  android:
    name: Android package
    needs: key
    if: needs.key.outputs.configured == 'true'
    runs-on: ubuntu-latest
    env:
      NDK: 27.1.12297006
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # `tools` is the action's default and no longer exists in the SDK, which
      # fails the whole step. The NDK comes from here rather than a later
      # sdkmanager call so the licences are accepted in one place.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;${{ env.NDK }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Point the build at the NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK" >> "$GITHUB_ENV"

      - name: Build the frontend
        working-directory: web
        run: npm ci && npm run build

      - name: Build
        working-directory: mobile
        env:
          TSUBURU_RELEASES: ${{ github.repository }}
        run: |
          npm ci
          npx tauri android build --target aarch64 --apk

      - name: Sign
        working-directory: mobile
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p dist
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          unsigned=$(find src-tauri/gen/android -name '*-unsigned.apk' | head -1)
          "$tools/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign \
            --ks "$RUNNER_TEMP/keystore.jks" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$PASSWORD" --key-pass "pass:$PASSWORD" \
            --out "dist/tsuburu-${GITHUB_REF_NAME#v}.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "dist/tsuburu-${GITHUB_REF_NAME#v}.apk"
          rm -f "$RUNNER_TEMP/keystore.jks" "$RUNNER_TEMP/aligned.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tsuburu-android
          path: mobile/dist/*.apk

  release:
    needs: [build, image, ios, android]
    # The Android job is skipped where no key is configured; the release still
    # goes out with everything else.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/')
      && needs.build.result == 'success' && needs.image.result == 'success'
      && needs.ios.result == 'success' && needs.android.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Only the packaged downloads. The image job leaves a build record
      # artifact beside them that is not one of ours and does not unpack.
      - uses: actions/download-artifact@v4
        with:
          pattern: tsuburu-*
          path: dist
          merge-multiple: true

      # What changed goes first. The tag already says it, and the program
      # reads the first lines of this when it offers the update - which was
      # showing people how to unpack a zip instead.
      # A compose file that pulls the image this tag published, so running it
      # is one download and one command with nothing to compile. The image
      # name is written here rather than committed, for the same reason the
      # update address is: the source does not name where it is published.
      - name: Write the compose file
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          cat > dist/compose.yaml <<COMPOSE
          # tsuburu, ${GITHUB_REF_NAME}. Put this in an empty directory and run:
          #
          #   docker compose up -d
          #
          # then open http://127.0.0.1:8420/ . Nothing is compiled and nothing
          # is installed outside the container.
          #
          # Everything it keeps - the databases, anything imported, the model
          # if you switch it on - lives in the \`data\` volume and survives
          # \`docker compose down\`. Use \`down -v\` to throw it away too.

          services:
            tsuburu:
              image: ${image}:${version}
              restart: unless-stopped
              # Loopback only. Change the left-hand side to 8420:8420 to let
              # the rest of the network in, and know that it is the whole of
              # hitomi behind no password when you do.
              ports:
                - "127.0.0.1:8420:8420"
              volumes:
                - data:/data
              # redb repairs a file that was not closed, and on a large corpus
              # that costs half a minute and a couple of gigabytes the next
              # time it starts. The program catches TERM and closes properly,
              # so give it room to.
              stop_grace_period: 30s

          volumes:
            data:
          COMPOSE

      - name: Write the notes
        run: |
          # The whole message, not the body: git calls the first paragraph the
          # subject, and a release note that opens by dropping its first
          # paragraph is worse than one that repeats a line. Fetched again
          # because a checkout does not always bring the annotation with it.
          git fetch --force --tags --depth=1 origin "refs/tags/$GITHUB_REF_NAME" || true
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          cat >> notes.md <<'TAIL'

          ---

          Download the file for your computer, open it, and read
          `START-HERE.txt` inside. Nothing is installed.

          | | Download | Then |
          | :-- | :-- | :-- |
          | **Windows** | `…windows-msvc.zip` | double-click `tsuburu.exe` |
          | **Mac** (M1 and later) | `…aarch64-apple-darwin.zip` | double-click `Start tsuburu.command` |
          | **Mac** (Intel) | `…x86_64-apple-darwin.zip` | double-click `Start tsuburu.command` |
          | **Linux** | `…linux-gnu.tar.gz` | run `start.sh` |
          | **Docker** | `compose.yaml` | `docker compose up -d` |
          | **Android** | `tsuburu-….apk` | open it on the phone and allow the install |
          | **iPhone** | `…unsigned.ipa` | sign it yourself, below |

          These builds are not signed, so each system warns once the first
          time. Windows: *More info → Run anyway*. macOS: right-click
          `Start tsuburu.command` and choose *Open*.

          The iPhone package is not signed by anybody, because Apple only lets
          an app be signed by an Apple account and ours would not work for
          you. Sign it with your own through **AltStore** or **SideStore** on
          the phone, or **Sideloadly** from a computer. A free Apple ID lasts
          seven days before it has to be signed again; a paid one lasts a year.
          TAIL

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.ipa
            dist/*.apk
            dist/compose.yaml
          body_path: notes.md
          generate_release_notes: true
