name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the frontend
        working-directory: web
        run: npm ci && npm run build

      - run: cargo build --release --locked -p tsuburu --target ${{ matrix.target }}

      # Packed so that someone who has never opened a terminal can start it:
      # zip on macOS and Windows, which both unpack on a double-click, and a
      # launcher beside the binary that does the one awkward step for them.
      - name: Package
        shell: bash
        run: |
          name="tsuburu-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md README.ko.md LICENSE "dist/$name/"

          case "${{ matrix.os }}" in
            windows-latest)
              cp "target/${{ matrix.target }}/release/tsuburu.exe" "dist/$name/"
              cp packaging/START-HERE-windows.txt "dist/$name/START-HERE.txt"
              (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
              ;;
            macos-latest)
              cp "target/${{ matrix.target }}/release/tsuburu" "dist/$name/"
              cp "packaging/start-macos.command" "dist/$name/Start tsuburu.command"
              cp packaging/START-HERE-macos.txt "dist/$name/START-HERE.txt"
              chmod +x "dist/$name/tsuburu" "dist/$name/Start tsuburu.command"
              # -X keeps the archive free of the extra files macOS would add.
              (cd dist && zip -qrX "$name.zip" "$name")
              ;;
            *)
              cp "target/${{ matrix.target }}/release/tsuburu" "dist/$name/"
              cp packaging/start-linux.sh "dist/$name/start.sh"
              cp packaging/START-HERE-linux.txt "dist/$name/START-HERE.txt"
              chmod +x "dist/$name/tsuburu" "dist/$name/start.sh"
              (cd dist && tar -czf "$name.tar.gz" "$name")
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: tsuburu-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
          body: |
            Download the file for your computer, open it, and read
            `START-HERE.txt` inside. Nothing is installed.

            | | Download | Then |
            | :-- | :-- | :-- |
            | **Windows** | `…windows-msvc.zip` | double-click `tsuburu.exe` |
            | **Mac** (M1 and later) | `…aarch64-apple-darwin.zip` | double-click `Start tsuburu.command` |
            | **Mac** (Intel) | `…x86_64-apple-darwin.zip` | double-click `Start tsuburu.command` |
            | **Linux** | `…linux-gnu.tar.gz` | run `start.sh` |

            These builds are not signed, so each system warns once the first
            time. Windows: *More info → Run anyway*. macOS: right-click
            `Start tsuburu.command` and choose *Open*.
          generate_release_notes: true
