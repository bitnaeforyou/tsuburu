name: Mirror

# Pushes this repository to a second one under a different account, with the
# authorship rewritten on the way. Nothing about that account is written down
# here: the address, the token and the name to sign with all come from
# secrets, so the source stays silent about where it goes.
#
# Set up with:
#   gh secret set MIRROR_REPO   # owner/name of the target repository
#   gh secret set MIRROR_TOKEN  # a PAT on that account, scopes: repo, workflow
#   gh secret set MIRROR_NAME   # the name to sign the mirrored commits with
#   gh secret set MIRROR_EMAIL  # its address, e.g. the account's noreply one
#
# Without MIRROR_REPO the job skips, so the workflow is harmless unpaired.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Pushing a commit and its tag together starts two of these at once, and the
# second is refused because the first moved the branch under it. They take
# turns instead.
concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Is a mirror configured
        id: configured
        env:
          MIRROR_REPO: ${{ secrets.MIRROR_REPO }}
        run: echo "yes=${{ env.MIRROR_REPO != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.configured.outputs.yes == 'true'
        with:
          # The whole history, or the rewrite below would produce a stump.
          fetch-depth: 0
          # checkout otherwise leaves its own credentials in the git config,
          # as a header for github.com, and that header wins over the token
          # in the push URL: the push would go out as the Actions bot and be
          # refused by the other account.
          persist-credentials: false

      # Kept before the rewrite, which turns annotated tags into plain ones
      # and drops what they said. The mirror is the copy people download, so
      # its release notes are the ones a reader is offered on an update.
      - name: Keep what the tag says
        if: steps.configured.outputs.yes == 'true' && startsWith(github.ref, 'refs/tags/')
        run: git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/tag.txt"

      - name: Rewrite the authorship
        if: steps.configured.outputs.yes == 'true'
        env:
          MIRROR_NAME: ${{ secrets.MIRROR_NAME }}
          MIRROR_EMAIL: ${{ secrets.MIRROR_EMAIL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq git-filter-repo
          # Read from the environment rather than interpolating into the
          # callback: a name with a quote in it would otherwise be code.
          # Deterministic, so the mirror moves forward rather than being
          # replaced: the same commits in give the same hashes out.
          git filter-repo --force \
            --name-callback 'import os; return os.environb[b"MIRROR_NAME"]' \
            --email-callback 'import os; return os.environb[b"MIRROR_EMAIL"]'

      # What the mirror says about itself, said here. The mirror is the copy
      # people find, so leaving it blank leaves the program undescribed; and
      # keeping the words in one place means they cannot drift apart.
      - name: Describe it the same way
        if: steps.configured.outputs.yes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_REPO: ${{ secrets.MIRROR_REPO }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" --jq '{description}' > "$RUNNER_TEMP/about.json"
          gh api "repos/$GITHUB_REPOSITORY/topics" --jq '{names}' > "$RUNNER_TEMP/topics.json"
          GH_TOKEN="$MIRROR_TOKEN" gh api -X PATCH "repos/$MIRROR_REPO" \
            --input "$RUNNER_TEMP/about.json" --silent
          GH_TOKEN="$MIRROR_TOKEN" gh api -X PUT "repos/$MIRROR_REPO/topics" \
            --input "$RUNNER_TEMP/topics.json" --silent

      - name: Say it again on the rewritten tag
        if: steps.configured.outputs.yes == 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          MIRROR_NAME: ${{ secrets.MIRROR_NAME }}
          MIRROR_EMAIL: ${{ secrets.MIRROR_EMAIL }}
        run: |
          [ -s "$RUNNER_TEMP/tag.txt" ] || exit 0
          git config user.name "$MIRROR_NAME"
          git config user.email "$MIRROR_EMAIL"
          git tag -f -a "$GITHUB_REF_NAME" -F "$RUNNER_TEMP/tag.txt" HEAD

      - name: Push
        if: steps.configured.outputs.yes == 'true'
        env:
          MIRROR_REPO: ${{ secrets.MIRROR_REPO }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git push --force \
            "https://x-access-token:$MIRROR_TOKEN@github.com/$MIRROR_REPO.git" \
            HEAD:main --tags
