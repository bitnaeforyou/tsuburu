name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The other two platforms once a week, so drift between releases is found
  # by a run nobody had to remember to start.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# A push that lands while the last one is still building makes that build
# answer a question nobody is asking any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same test run costs nothing on the public mirror and is charged here,
  # so it happens there. This side only decides which side it is.
  where:
    runs-on: ubuntu-latest
    outputs:
      public: ${{ steps.look.outputs.public }}
    steps:
      - id: look
        env:
          MIRROR_REPO: ${{ secrets.MIRROR_REPO }}
        run: echo "public=${{ env.MIRROR_REPO == '' }}" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }})
    needs: where
    if: needs.where.outputs.public == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # This repository is private, so its minutes are charged, and a macOS
        # minute is charged as ten. The tests are the same tests on every
        # platform - there is no platform-specific code under them - and a
        # release builds all three anyway, so a plain push is checked on the
        # cheap one and the full set runs on a pull request, on the weekly
        # schedule, and by hand.
        os: >-
          ${{ fromJSON(github.event_name == 'push'
          && '["ubuntu-latest"]'
          || '["macos-latest","ubuntu-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The frontend is embedded at compile time, so it has to exist before
      # cargo runs.
      - name: Build the frontend
        working-directory: web
        run: npm ci && npm run build

      - name: Check the frontend
        working-directory: web
        run: npm run check
        if: matrix.os == 'ubuntu-latest'

      - name: Test the frontend
        working-directory: web
        run: npm test

      - run: cargo fmt --all --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Network tests are marked ignored and stay out of CI: they depend on
      # a third-party site being up and unchanged.
      - run: cargo test --workspace
