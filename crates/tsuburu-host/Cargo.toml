[package]
name = "tsuburu-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tracing = { workspace = true }
serde = { workspace = true }

# Handing a file to another application is the one thing on a phone that the
# standard library cannot do: it is an intent, and an intent is a Java call.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
