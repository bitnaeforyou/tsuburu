[package]
name = "tsuburu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tsuburu"
path = "src/main.rs"

[dependencies]
tsuburu-hitomi = { path = "../tsuburu-hitomi" }
tsuburu-fetch = { path = "../tsuburu-fetch" }
tsuburu-server = { path = "../tsuburu-server" }
tsuburu-store = { path = "../tsuburu-store" }
tsuburu-dialogue = { path = "../tsuburu-dialogue" }
tsuburu-ocr = { path = "../tsuburu-ocr" }
tsuburu-meta = { path = "../tsuburu-meta" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
open = "5"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
