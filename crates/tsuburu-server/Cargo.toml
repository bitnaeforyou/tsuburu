[package]
name = "tsuburu-server"
version = "0.3.12"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tsuburu-hitomi = { path = "../tsuburu-hitomi" }
tsuburu-fetch = { path = "../tsuburu-fetch" }
tsuburu-store = { path = "../tsuburu-store" }
tsuburu-korean = { path = "../tsuburu-korean" }
tsuburu-dialogue = { path = "../tsuburu-dialogue" }
tsuburu-ocr = { path = "../tsuburu-ocr" }
tsuburu-meta = { path = "../tsuburu-meta" }
tsuburu-embed = { path = "../tsuburu-embed" }
tsuburu-update = { path = "../tsuburu-update" }
tsuburu-downloads = { path = "../tsuburu-downloads" }
tsuburu-keywords = { path = "../tsuburu-keywords" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tower-http = { version = "0.6", default-features = false, features = ["trace"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
quick_cache = "0.6"
# `debug-embed` so a debug build carries the frontend too. Without it
# rust-embed reads the files off disk at runtime, which is invisible on a
# desktop and on an iOS simulator - both can see the path it was built
# from - and leaves a phone with no interface at all.
rust-embed = { version = "8", features = ["mime-guess", "debug-embed"] }
mime_guess = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
tempfile = "3"
tsuburu-hitomi = { path = "../tsuburu-hitomi", features = ["mock"] }
tsuburu-downloads = { path = "../tsuburu-downloads" }
tsuburu-dialogue = { path = "../tsuburu-dialogue" }
tsuburu-ocr = { path = "../tsuburu-ocr" }
