[package]
name = "tsuburu-update"
version = "0.3.12"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "json"] }
tokio = { workspace = true, features = ["process", "fs", "time", "io-util", "rt"] }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
tempfile = "3"
