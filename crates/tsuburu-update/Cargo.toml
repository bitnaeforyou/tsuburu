[package]
name = "tsuburu-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "json"] }
tokio = { workspace = true, features = ["process", "fs", "time", "io-util", "rt"] }
futures-util = { version = "0.3", default-features = false }
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"

# Handing an APK to the system installer is the one thing on a phone that
# cannot be done through the standard library: it is an Android intent, and
# an intent is a Java call.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
